! ========== DEVICE IDENTITY ==========
hostname ACC-02
no ip domain lookup
ip domain name campus.example
banner motd ^Authorized network access only.^

! ========== GENERAL SETTINGS ==========
service timestamps debug datetime msec
service timestamps log datetime msec
service sequence-numbers
no service pad

! ========== SSH / LOGIN SECURITY ==========
! Local user credentials omitted from public reference.
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login on-failure log
login on-success log
no ip http server
no ip http secure-server

! ========== LOGGING ==========
logging buffered 65536 informational

! ========== CONSOLE ==========
line console 0
 login local
 logging synchronous
 exec-timeout 10 0
exit

! ========== SSH REMOTE ACCESS ==========
! Secure additional VTY lines if present.
line vty 0 4
 login local
 transport input ssh
 exec-timeout 15 0
 logging synchronous
exit

! ========== RSA KEYS ==========
! Generate RSA keys separately.

! ========== VLAN DATABASE ==========
vlan 10
 name USERS
exit
vlan 20
 name STAFF
exit
vlan 90
 name MANAGEMENT
exit
vlan 999
 name BLACKHOLE
exit

! ========== UNUSED PORTS ==========
interface range GigabitEthernet0/3, GigabitEthernet1/0-3, GigabitEthernet2/0-3, GigabitEthernet3/0-3
 switchport mode access
 switchport access vlan 999
 shutdown
exit

! ========== UPLINK TRUNKS ==========
interface range GigabitEthernet0/0-1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,90
 switchport trunk native vlan 999
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
exit

! ========== PC ACCESS PORT ==========
interface GigabitEthernet0/2
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no ip dhcp snooping trust
 no ip arp inspection trust
 no shutdown
exit

! ========== SWITCH MANAGEMENT ==========
interface Vlan90
 ip address 10.10.90.12 255.255.255.0
 no shutdown
exit
ip default-gateway 10.10.90.254

! ========== DHCP SNOOPING ==========
no ip dhcp snooping information option
ip dhcp snooping
ip dhcp snooping vlan 10,20,90

! ========== DYNAMIC ARP INSPECTION ==========
ip arp inspection vlan 20
