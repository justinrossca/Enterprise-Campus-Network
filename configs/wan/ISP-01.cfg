! ========== DEVICE IDENTITY ==========
hostname ISP-01
no ip domain lookup
ip cef

! ========== INTERNET CONNECTION ==========
interface GigabitEthernet0/0
 ip address dhcp
 ip nat outside
 ip virtual-reassembly in
exit

! ========== BGP UPLINKS TO ENTERPRISE ==========
! Connection to EDGE-01
interface GigabitEthernet0/1
 ip address 198.51.100.1 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
exit

! Connection to EDGE-02
interface GigabitEthernet0/2
 ip address 198.51.100.5 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
exit

! ========== INTER-ISP CONNECTION ==========
! Connection to ISP-02
interface GigabitEthernet0/3
 ip address 203.0.113.1 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
exit

! ========== BGP ROUTING ==========
router bgp 65001
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 198.51.100.2 remote-as 65000
 neighbor 198.51.100.6 remote-as 65000
 neighbor 203.0.113.2 remote-as 65002
 address-family ipv4
  neighbor 198.51.100.2 activate
  neighbor 198.51.100.2 default-originate
  neighbor 198.51.100.6 activate
  neighbor 198.51.100.6 default-originate
  neighbor 203.0.113.2 activate
 exit-address-family
exit

! ========== NAT / PAT ==========
ip nat inside source list ISP1-PAT interface GigabitEthernet0/0 overload

! ========== NAT ACCESS CONTROL LIST ==========
ip access-list standard ISP1-PAT
 permit 198.51.100.0 0.0.0.7
exit
