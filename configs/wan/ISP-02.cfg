! ========== DEVICE IDENTITY ==========
hostname ISP-02
no ip domain lookup
ip cef

! ========== INTERNET CONNECTION ==========
interface GigabitEthernet0/0
 ip address dhcp
exit

! ========== BGP UPLINKS TO ENTERPRISE ==========
! Connection to EDGE-02
interface GigabitEthernet0/1
 ip address 192.0.2.1 255.255.255.252
exit

! Connection to EDGE-01
interface GigabitEthernet0/2
 ip address 192.0.2.5 255.255.255.252
exit

! ========== INTER-ISP CONNECTION ==========
! Connection to ISP-01
interface GigabitEthernet0/3
 ip address 203.0.113.2 255.255.255.252
exit

! ========== UNUSED INTERFACES ==========
interface GigabitEthernet0/5
 no ip address
 shutdown
exit

! ========== BGP ROUTING ==========
router bgp 65002
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 192.0.2.2 remote-as 65000
 neighbor 192.0.2.6 remote-as 65000
 neighbor 203.0.113.1 remote-as 65001
 address-family ipv4
  neighbor 192.0.2.2 activate
  neighbor 192.0.2.2 default-originate
  neighbor 192.0.2.6 activate
  neighbor 192.0.2.6 default-originate
  neighbor 203.0.113.1 activate
 exit-address-family
exit

! ========== NAT / PAT ==========
! NAT/PAT not configured on ISP-02.
