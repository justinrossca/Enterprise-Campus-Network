! DOCUMENTATION REFERENCE | EDGE-02 | ENTERPRISE AS 65000
! Consolidated single-site design based on campus configuration and dual-ISP running-config snapshot.
! Not a verified current running configuration; credentials omitted.
! VLAN 90, OSPF router IDs, and router descriptions are aligned to the campus reference.
! Verify interfaces and dependencies before applying to GNS3 nodes.

! ========== DEVICE IDENTITY ==========
hostname EDGE-02
no ip domain lookup
ip domain name campus.example
banner motd ^Authorized network access only.^

! ========== GENERAL SETTINGS ==========
service timestamps debug datetime msec
service timestamps log datetime msec
service sequence-numbers
no service pad
ip cef

! ========== SSH / LOGIN SECURITY ==========
! Local user credentials omitted from public reference.
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login on-failure log
login on-success log
no ip http server
no ip http secure-server

! ========== LOGGING ==========
logging buffered 65536 informational

! ========== CONSOLE ==========
line console 0
 login local
 logging synchronous
 exec-timeout 10 0
exit

! ========== SSH REMOTE ACCESS ==========
! Secure additional VTY lines if present.
line vty 0 4
 login local
 transport input ssh
 exec-timeout 15 0
 logging synchronous
exit

! ========== RSA KEYS ==========
! Generate RSA keys separately.

! ========== BGP PEERING LOOPBACK ==========
interface Loopback1
 ip address 2.2.2.2 255.255.255.255
exit

! ========== ROUTED CAMPUS AND ISP LINKS ==========
interface GigabitEthernet0/0
 description TO-DIST-02
 ip address 10.0.0.10 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
 ip ospf network point-to-point
 no shutdown
exit

interface GigabitEthernet0/1
 description TO-ISP-2
 ip address 192.0.2.2 255.255.255.252
 ip nat outside
 ip virtual-reassembly in
 no shutdown
exit

interface GigabitEthernet0/2
 description TO-ISP-1
 ip address 198.51.100.6 255.255.255.252
 ip nat outside
 ip virtual-reassembly in
 no shutdown
exit

interface GigabitEthernet0/3
 description TO-DIST-01
 ip address 10.0.0.6 255.255.255.252
 ip nat inside
 ip virtual-reassembly in
 ip ospf network point-to-point
 no shutdown
exit

! ========== OSPF AREA 0 ==========
router ospf 1
 router-id 4.4.4.4
 auto-cost reference-bandwidth 10000
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/3
 network 2.2.2.2 0.0.0.0 area 0
 network 10.0.0.4 0.0.0.3 area 0
 network 10.0.0.8 0.0.0.3 area 0
 default-information originate
exit

! ========== ENTERPRISE BGP (AS 65000) ==========
router bgp 65000
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 1.1.1.1 remote-as 65000
 neighbor 1.1.1.1 update-source Loopback1
 neighbor 192.0.2.1 remote-as 65002
 neighbor 198.51.100.5 remote-as 65001
 address-family ipv4
  network 10.10.10.0 mask 255.255.255.0
  network 10.10.20.0 mask 255.255.255.0
  network 10.10.90.0 mask 255.255.255.0
  aggregate-address 10.10.0.0 255.255.0.0 as-set summary-only
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.1 next-hop-self
  neighbor 192.0.2.1 activate
  neighbor 198.51.100.5 activate
  neighbor 198.51.100.5 route-map PREFER-ISP01 in
 exit-address-family
exit

! ========== ISP-1 NAT / PAT ==========
ip nat inside source route-map CAMPUS-NAT-ISP1 interface GigabitEthernet0/2 overload
ip access-list extended CAMPUS-NAT-LAN
 permit ip 10.10.0.0 0.0.255.255 any
exit
route-map CAMPUS-NAT-ISP1 permit 10
 match ip address CAMPUS-NAT-LAN
 match interface GigabitEthernet0/2
exit

! ========== BGP ROUTE POLICIES ==========
ip prefix-list DEFAULT-ONLY seq 5 permit 0.0.0.0/0
route-map PREFER-ISP01 permit 10
 match ip address prefix-list DEFAULT-ONLY
 set local-preference 200
exit
! Corrected source typo PREFER-IPS01 -> PREFER-ISP01; preserves unmatched prefixes.
route-map PREFER-ISP01 permit 20
exit
! The following lists are documented from the source but NOT applied to peers.
! ISP-OUT denies everything if applied, so review before use.
ip prefix-list ISP-IN seq 5 permit 0.0.0.0/0
ip prefix-list ISP-IN seq 10 permit 203.0.113.0/24 le 32
ip prefix-list ISP-OUT seq 5 deny 0.0.0.0/0 le 32
! ISP-2 PAT was not configured in the supplied source: failover needs validation.
