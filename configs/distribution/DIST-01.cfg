! ========== DEVICE IDENTITY ==========
hostname DIST-01
no ip domain lookup
ip domain name campus.example
banner motd ^Authorized network access only.^

! ========== GENERAL SETTINGS ==========
service timestamps debug datetime msec
service timestamps log datetime msec
service sequence-numbers
no service pad
ip cef
ip routing

! ========== SSH / LOGIN SECURITY ==========
! Local user credentials omitted from public reference.
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
login on-failure log
login on-success log
no ip http server
no ip http secure-server

! ========== LOGGING ==========
logging buffered 65536 informational

! ========== CONSOLE ==========
line console 0
 login local
 logging synchronous
 exec-timeout 10 0
exit

! ========== SSH REMOTE ACCESS ==========
! Secure additional VTY lines if present.
line vty 0 4
 login local
 transport input ssh
 exec-timeout 15 0
 logging synchronous
exit

! ========== RSA KEYS ==========
! Generate RSA keys separately.

! ========== VLAN DATABASE ==========
vlan 10
 name USERS
exit
vlan 20
 name STAFF
exit
vlan 90
 name MANAGEMENT
exit
vlan 999
 name BLACKHOLE
exit

! ========== UNUSED PORTS ==========
interface range GigabitEthernet1/3, GigabitEthernet2/0-3, GigabitEthernet3/0-3
 switchport mode access
 switchport access vlan 999
 shutdown
exit

! ========== LACP ETHERCHANNEL ==========
! Three links connecting to DIST-02.
interface range GigabitEthernet1/0, GigabitEthernet0/2-3
 switchport mode trunk
 switchport trunk allowed vlan 10,20,90
 switchport trunk native vlan 999
 channel-protocol lacp
 channel-group 1 mode active
 no shutdown
exit

interface Port-channel1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,90
 switchport trunk native vlan 999
 no shutdown
exit

! ========== ACCESS SWITCH UPLINKS ==========
interface range GigabitEthernet0/0-1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,90
 switchport trunk native vlan 999
 no shutdown
exit

! ========== INTER-VLAN ROUTING & HSRP ==========
interface Vlan10
 ip address 10.10.10.1 255.255.255.0
 standby version 2
 standby 10 ip 10.10.10.254
 standby 10 priority 110
 standby 10 preempt
 ip helper-address 10.0.0.2
 no shutdown
exit

interface Vlan20
 ip address 10.10.20.1 255.255.255.0
 standby version 2
 standby 20 ip 10.10.20.254
 standby 20 priority 90
 standby 20 preempt
 ip helper-address 10.0.0.2
 no shutdown
exit

interface Vlan90
 ip address 10.10.90.1 255.255.255.0
 standby version 2
 standby 90 ip 10.10.90.254
 standby 90 priority 110
 standby 90 preempt
 ip helper-address 10.0.0.2
 no shutdown
exit

! ========== L3 ROUTED UPLINKS ==========
interface GigabitEthernet1/1
 no switchport
 ip address 10.0.0.1 255.255.255.252
 no shutdown
exit

interface GigabitEthernet1/2
 no switchport
 ip address 10.0.0.5 255.255.255.252
 no shutdown
exit

! ========== OSPF ==========
router ospf 1
 router-id 1.1.1.1
 network 10.0.0.0 0.0.0.3 area 0
 network 10.0.0.4 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.90.0 0.0.0.255 area 0
 passive-interface default
 no passive-interface GigabitEthernet1/1
 no passive-interface GigabitEthernet1/2
exit
